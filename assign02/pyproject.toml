[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merkle"
version = "1.0.0"
description = "Merkle tree library and CLI with domain-separated hashing and strict proofs"
requires-python = ">=3.11"
dependencies = []          # standard library only

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
merkle = "merkle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
