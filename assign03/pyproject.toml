[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toywallet"
version = "1.0.0"
description = "Educational secp256k1 wallet: keygen, Base58Check addresses, canonical signed transactions"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]   # maintained library: secp256k1 ECDSA (OpenSSL)

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
toywallet = "toywallet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
