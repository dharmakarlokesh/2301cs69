[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utxo-ledger"
version = "1.0.0"
description = "In-memory UTXO ledger, P2PKH validator and deterministic wallet"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]   # maintained library: secp256k1 ECDSA (OpenSSL)

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
utxo = "utxo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
