[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toychain"
version = "1.0.0"
description = "Block headers, toy Proof of Work, most-work chain selection and reorganisation"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]   # maintained library: secp256k1 ECDSA (OpenSSL)

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
chain = "chain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
