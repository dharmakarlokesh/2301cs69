[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toynet"
version = "1.0.0"
description = "Peer-to-peer mempool and block relay network over localhost TCP"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]   # maintained library: secp256k1 ECDSA (OpenSSL)

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
p2p = "p2p.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
